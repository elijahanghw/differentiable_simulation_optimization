# -----------------------------------------------------------------------
# Environment
# -----------------------------------------------------------------------
env:
  name: navigate_real
  dt: 0.01                # physics/policy timestep (100 Hz loop)
  integrator: semi_implicit_euler
  drone: ../drone/2inchwhoop.yaml   # path is resolved relative to this file
  grad_decay: 0.4

  # ---- Loss weights -------------------------------------------------------
  xy_weight:        1.0
  z_weight:         2.0
  vel_weight:       0.2
  max_vel_weight:   5.0
  rate_weight:      0.1
  collision_weight: 10.0
  obj_weight:       8.0
  heading_weight:   30.0
  smooth_action_weight: 0.01   # MSE between consecutive motor commands
  b1: 1.0
  b2: 32.0
  max_velocity: 3.0

  # ---- Drone initial state bounds ----------------------------------------
  init_x_min: -3.5
  init_x_max: -3.0
  init_y_min: -3.0
  init_y_max: 3.0
  init_z_min: -1.6
  init_z_max: -1.4

  # ---- Target spawn bounds -----------------------------------------------
  target_x_min: 3.0
  target_x_max: 3.5
  target_y_min: -1.0
  target_y_max: 1.0
  target_z_min: -1.5
  target_z_max: -1.5

  # ---- Scene (random obstacles) -----------------------------------------
  scene: ../scene/obstacles_real.yaml
  # scene: ../scene/columns_real.yaml

# -----------------------------------------------------------------------
# Policy
# -----------------------------------------------------------------------
# Recurrence is doubly needed here: the depth image alone does not resolve the
# obstacle field, and the per-episode airframe is not observable from a single
# frame either — the GRU has to infer both from the last few steps.
policy:
  type: cnn_gru
  squash_output: false
  conv_features: [32, 64, 128]
  kernel_sizes: [[2, 2], [3, 3], [3, 3]]
  strides: [[2, 2], [1, 1], [1, 1]]
  proj_dim: 64 # 192
  leaky_slope: 0.05
  hidden_size: 64 # 192

# -----------------------------------------------------------------------
# Training
# -----------------------------------------------------------------------
training:
  epochs: 3000
  horizon: 200
  # ---- Truncated BPTT (persistent carry across epochs) -------------------
  persistent_carry: true   # thread (state, obs, hidden, age, params) across epochs
  reset_on_crash:   true   # per-element in-scan reset when dist < 0 (collision)
  max_episode_len:  1000   # force-reset an element after this many steps (0 = unbounded)
  batch_size: 64
  lr: 1.0e-3
  lr_min: 1.0e-4
  grad_clip: 1.0
  log_interval: 50

# -----------------------------------------------------------------------
# Depth camera
# -----------------------------------------------------------------------
depth_camera:
  fov_deg: 80.0         # degrees — horizontal field of view
  width: 64             # pixels  → 16 after 4×4 pool
  height: 48            # pixels  → 12 after 4×4 pool
  min_range: 0.3        # m  — closer than this → 0 (blind zone)
  max_range: 3.0        # m  — farther / no-hit → max_range (saturated)
  quantization_m: 0.001 # m  — depth step size (1 mm, matches uint16 output)
  cam_hz: 20.0          # Hz — depth update rate (dt=0.01 → 100 Hz loop → frame_skip=10)

# -----------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------
logging:
  csv_path: logs/navigate_obstacles_real_64.csv
  checkpoint_path: checkpoints/navigate_obstacles_real_64.pkl
