# -----------------------------------------------------------------------
# Environment
# -----------------------------------------------------------------------
env:
  name: navigate
  integrator: semi_implicit_euler
  train_morphology: true      # required: compute_morphology uses the evolved genotype
  morph_init_scale: 0.0       # unused by evolution (genotype comes from CMA-ES)
  alternating_phi: false
  phi_default: 0.0
  grad_decay: 0.4

  # ---- Loss weights -------------------------------------------------------
  xy_weight:        1.0
  z_weight:         2.0
  vel_weight:       0.2
  rate_weight:      0.1
  collision_weight: 10.0
  obj_weight:       8.0
  heading_weight:   30.0
  b1: 1.0
  b2: 16.0

  # ---- Drone initial state bounds ----------------------------------------
  init_x_min: 0.0
  init_x_max: 1.0
  init_y_min: -2.0
  init_y_max: 2.0
  init_z_min: -1.4
  init_z_max: -1.6

  # ---- Target spawn bounds -----------------------------------------------
  target_x_min: 9.0
  target_x_max: 10.0
  target_y_min: -2.0
  target_y_max: 2.0
  target_z_min: -1.5
  target_z_max: -1.5

  # ---- Scene (random obstacles) -----------------------------------------
  scene: scene/obstacles.yaml

# -----------------------------------------------------------------------
# Policy
# -----------------------------------------------------------------------
policy:
  type: cnn_gru
  squash_output: false
  conv_features: [32, 64, 128]
  kernel_sizes: [[2, 2], [3, 3], [3, 3]]
  strides: [[2, 2], [1, 1], [1, 1]]
  proj_dim: 192
  leaky_slope: 0.05
  hidden_size: 192

# -----------------------------------------------------------------------
# Training  (algo: evolution — outer CMA-ES over morphology, inner BPTT for policy)
# -----------------------------------------------------------------------
training:
  algo: evolution
  # Inner-loop BPTT hyperparameters (per candidate morphology):
  horizon: 250
  batch_size: 64
  eval_batch_size: 128    # held-out episodes used to score each candidate
  lr: 1.0e-3
  lr_min: 1.0e-4
  grad_clip: 1.0
  log_interval: 1

# -----------------------------------------------------------------------
# Evolution  (outer loop)
# -----------------------------------------------------------------------
evolution:
  strategy: CMA_ES        # any evosax.algorithms class: CMA_ES, Open_ES, PGPE, Sep_CMA_ES, ...
  popsize: 5             # candidates per generation
  generations: 50         # outer CMA-ES steps
  sigma0: 0.5             # initial genotype std over the raw pre-sigmoid params
  inner_epochs: 1000       # BPTT epochs to train each candidate's policy

# -----------------------------------------------------------------------
# Depth camera
# -----------------------------------------------------------------------
depth_camera:
  fov_deg: 80.0
  width: 64
  height: 48
  min_range: 0.3
  max_range: 3.0
  quantization_m: 0.001
  cam_hz: 10.0

# -----------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------
logging:
  csv_path: logs/navigate_evolve_logs.csv
  checkpoint_path: checkpoints/navigate_evolve.pkl
